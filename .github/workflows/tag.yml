name: tag
# mintd's version comes from git tags (setuptools-scm). Each PR merged into main
# tags its merge commit: the next patch version, or the next minor when the PR
# carries the `minor` label. The first tag is v0.1.0. It then starts
# release.yml on that tag, which makes it a prerelease (RELEASING.md).
on:
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  contents: write
  actions: write  # to start release.yml on the new tag
jobs:
  tag:
    if: github.event.pull_request.merged == true
    # One at a time, so two quick merges cannot both claim the same version.
    # queue: max keeps every waiting run (up to 100) instead of cancelling all
    # but one; on the job, so a PR closed without merging never queues here.
    concurrency:
      group: tag
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # every tag, to find the latest version
      - name: Tag the merge commit
        env:
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR: ${{ github.event.pull_request.number }}
          MINOR: ${{ contains(github.event.pull_request.labels.*.name, 'minor') }}
        run: |
          set -euo pipefail
          # Only plain vX.Y.Z tags count: the list glob also matches hotfix tags
          # such as v0.4.0.post1, whose "0.post1" patch is not a number.
          if git tag --points-at "$SHA" | grep -qxE 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "$SHA is already tagged"; exit 0
          fi
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
                   | { grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+' || true; } | head -n1)
          if [ -z "$last" ]; then
            next=v0.1.0
          elif ! git merge-base --is-ancestor "$(git rev-list -n1 "$last")" "$SHA"; then
            # The queue's order is not guaranteed: a newer merge was tagged
            # first, and its release already holds this commit.
            echo "$SHA is older than $last, which includes it; not tagged"; exit 0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            if [ "$MINOR" = "true" ]; then
              next="v${major}.$((minor + 1)).0"
            else
              next="v${major}.${minor}.$((patch + 1))"
            fi
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$next" "$SHA" -m "$next (#$PR)"
          git push origin "$next"
          echo "tagged $SHA as $next"
      - name: Start the release workflow on the tag
        env:
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(git tag --points-at "$SHA" | { grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+' || true; } | head -n1)
          if [ -z "$tag" ]; then
            echo "$SHA has no release tag; nothing to release"; exit 0
          fi
          # The dispatch API takes a branch or tag name, so no branch may share it.
          if [ -n "$(git ls-remote --heads origin "refs/heads/$tag")" ]; then
            echo "::error::a branch is also named $tag; start release.yml by hand (RELEASING.md)"; exit 1
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
          echo "started release.yml on $tag"
