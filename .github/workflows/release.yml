name: release
# A release when the maintainer asks for one: Actions -> release -> Run workflow
# on main (patch or minor), or on a hotfix/vX.Y.Z branch (vX.Y.Z.postN). It
# tests and builds that commit, publishes it as a prerelease only once every
# file is up (which makes its v tag), installs it from its own URL, and waits
# for the maintainer's yes in the `release` environment before it becomes the
# latest release. The runbook is RELEASING.md.
#
# The wheel is built once here, and that file is what the prerelease carries;
# nothing is rebuilt at promotion. `releases/latest` skips prereleases, so
# users get this version only after the `promote` job is approved.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "On main: patch or minor. Ignored on a hotfix/vX.Y.Z branch."
        type: choice
        options: [patch, minor]
        default: patch
permissions: {}
# One release at a time: a second press waits until the first is approved,
# rejected or fails, so two runs never claim one number.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    # The number, chosen once: a re-run of failed jobs keeps it.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      BUMP: ${{ inputs.bump }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # every tag, to find the latest version
          persist-credentials: false
      - name: Choose the version
        id: version
        run: |
          set -euo pipefail
          # Only main or a hotfix/vX.Y.Z branch, and only a commit after the
          # latest tag on its line (scripts/release_version.py says why not).
          tag=$(python3 scripts/release_version.py "$GITHUB_REF" "$GITHUB_SHA" "$BUMP")
          # A tag that exists already is never reused or moved, even one this
          # checkout doesn't have.
          err=$(mktemp)
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" > /dev/null 2>"$err"; then
            echo "::error::$tag already exists; a version is never reused"; exit 1
          elif ! grep -q 'HTTP 404' "$err"; then
            cat "$err" >&2; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "this run releases $GITHUB_SHA as $tag"
  test:
    # CI on the exact commit being released.
    needs: version
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
  build:
    # Read-only: the build runs the build backend fresh from PyPI
    # (setuptools-scm is not in the lock), so it never holds a write token.
    needs: [version, test]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Keep equal to test.yml, install.sh and install.ps1.
          version: "0.13.9"
          python-version: "3.13"
          # No cache: one written by another workflow's run must not feed the build.
          enable-cache: false
      - name: Build the release files
        run: |
          set -euo pipefail
          # The tag is written into files users run, so it must be exactly this shape.
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.post[0-9]+)?$ ]] || { echo "::error::$TAG is not vX.Y.Z or vX.Y.Z.postN"; exit 1; }
          # The tag is made only when the release is published, so the version
          # is given to setuptools-scm, which would otherwise build a dev wheel.
          export SETUPTOOLS_SCM_PRETEND_VERSION_FOR_MINTD="${TAG#v}"
          # Outside the checkout, so the tree stays clean for setuptools-scm.
          # The lock pins setuptools for the build (setuptools-scm is not in it).
          uv export --locked --no-dev --no-emit-project --no-hashes -q -o "$RUNNER_TEMP/build.txt"
          uv build --wheel --build-constraints "$RUNNER_TEMP/build.txt" --out-dir dist
          wheel="mintd-${TAG#v}-py3-none-any.whl"
          # A misread version (a dev build) never ships under a release tag.
          test -f "dist/$wheel" || { echo "::error::built $(ls dist), expected $wheel"; exit 1; }
          (cd dist && sha256sum "$wheel" > "$wheel.sha256")
          # With hashes. --extra schema adds the pins `--with-schema` needs;
          # a constraints file only limits versions, it installs nothing.
          uv export --locked --no-dev --no-emit-project --extra schema -q -o dist/constraints.txt
      - name: Stamp the install scripts
        # Writes the tag into the release's own install.sh and install.ps1, with
        # the one stamper CI's install checks will use too.
        run: python3 scripts/stamp_install_scripts.py "$TAG" --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
  prerelease:
    needs: [version, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Publish the prerelease
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          [ ${#files[@]} -gt 0 ] || { echo "::error::dist/ is empty: there is nothing to release"; exit 1; }
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          notes="The release gate is running: $run_url. The \`evidence\` job replaces this note with its results."
          # Every release for the tag, drafts included: one line each, across
          # every page. Captured with out=$(...), so a failed listing fails the step.
          releases() {
            gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft) \(.prerelease) \(.target_commitish) \(.html_url)"'
          }
          # Sets $tagged to the commit the tag names, or to nothing when there is
          # no tag yet (a 404 or 422). Anything else stops the step. gh prints an
          # error's body on stdout, so stdout is read only when gh succeeded, and
          # this runs outside $(...), where a failure would be ignored.
          lookup_tag() {
            local out err; out=$(mktemp); err=$(mktemp)
            if gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha >"$out" 2>"$err"; then
              tagged=$(cat "$out")
              [[ $tagged =~ ^[0-9a-f]+$ ]] || { echo "::error::$TAG's commit read as '$tagged'"; exit 1; }
            elif grep -qE 'HTTP (404|422)' "$err"; then
              tagged=""
            else
              cat "$err" >&2; echo "::error::couldn't read which commit $TAG names (RELEASING.md, A failed run)"; exit 1
            fi
          }
          out=$(releases)
          count=0
          [ -z "$out" ] || count=$(grep -c '' <<< "$out")
          if [ "$count" -gt 1 ]; then
            echo "::error::several releases for $TAG: delete the stray drafts by id (RELEASING.md, A failed run)"
            echo "$out"
            exit 1
          elif [ "$count" -eq 0 ]; then
            # A draft until every file is up: a published release's files are
            # final. Its tag is made at publish, on this commit.
            gh release create "$TAG" --draft --prerelease --latest=false --target "$GITHUB_SHA" --title "$TAG" --notes "$notes"
            out=$(releases)  # the new draft's id, for any stop below to name
            [ -n "$out" ] && [ "$(grep -c '' <<< "$out")" -eq 1 ] \
              || { echo "::error::$TAG's new draft isn't listed as its only release; re-run (RELEASING.md, A failed run)"; exit 1; }
          fi
          read -r id draft prerelease target _ <<< "$out"
          # Every stop names which it is: a draft is deleted by its id and re-run;
          # a published release is never changed.
          what=$([ "$draft" = true ] && echo "draft $id" || echo "published release")
          # A draft is reused only for this commit: another one's would become a
          # permanent tag on the wrong commit.
          if [ "$draft" = true ] && [ "$target" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG's $what targets $target, not this run's $GITHUB_SHA: delete it by its id and re-run (RELEASING.md, A failed run)"; exit 1
          fi
          if [ "$prerelease" != true ] && [ "$draft" = true ]; then
            echo "::error::$TAG's $what is not a prerelease: delete it by its id and re-run (RELEASING.md, A failed run)"; exit 1
          elif [ "$prerelease" != true ]; then
            echo "::error::$TAG is not a prerelease; a promoted release is never changed"; exit 1
          fi
          # Every file the release has must be one of dist/*, fully uploaded,
          # the same bytes.
          check() {
            have=$(gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.state) \(.digest)"')
            while read -r name state digest; do
              if [ -z "$name" ]; then
                continue
              elif [ ! -f "dist/$name" ]; then
                echo "::error::$TAG's $what has $name, which this build didn't make (RELEASING.md, A failed run)"; exit 1
              elif [ "$state" != uploaded ] || [ "$digest" = null ]; then
                echo "::error::$TAG's $what has an incomplete upload of $name (RELEASING.md, A failed run)"; exit 1
              elif [ "$digest" != "sha256:$(sha256sum "dist/$name" | cut -d' ' -f1)" ]; then
                echo "::error::$TAG's $what already has a different $name; a release's files are never replaced (RELEASING.md, A failed run)"; exit 1
              fi
            done <<< "$have"
          }
          has() { awk -v n="${1##*/}" '$1 == n {found = 1} END {exit !found}' <<< "$have"; }
          check
          if [ "$draft" != true ]; then
            # Published, by this run before a later step failed: it passes only
            # on this commit with every file; it is never changed.
            lookup_tag
            [ "$tagged" = "$GITHUB_SHA" ] \
              || { echo "::error::$TAG's published release is on another commit, not this run's $GITHUB_SHA (RELEASING.md, A failed run)"; exit 1; }
            for f in "${files[@]}"; do
              has "$f" || { echo "::error::$TAG's published release is missing ${f##*/}; a published release's files are never changed (RELEASING.md, A failed run)"; exit 1; }
            done
            exit 0
          fi
          for f in "${files[@]}"; do
            has "$f" || gh release upload "$TAG" "$f"
          done
          # Publish only a draft that holds exactly dist/*, each file uploaded
          # whole and the same bytes.
          check
          for f in "${files[@]}"; do
            has "$f" || { echo "::error::$TAG's $what is still missing ${f##*/} (RELEASING.md, A failed run)"; exit 1; }
          done
          # Seconds before publishing, the tag must still not exist: publishing
          # onto an existing tag would attach this release to its old commit.
          lookup_tag
          [ -z "$tagged" ] || { echo "::error::$TAG appeared since this run began; a version is never reused (RELEASING.md, A failed run)"; exit 1; }
          gh release edit "$TAG" --draft=false --prerelease --latest=false
          # The tag is permanent now: it must name this commit, before anything else runs.
          lookup_tag
          [ "$tagged" = "$GITHUB_SHA" ] \
            || { echo "::error::$TAG landed on ${tagged:-nothing}, not $GITHUB_SHA: the release stays an unpromoted prerelease and the next press takes the next number (RELEASING.md, A failed run)"; exit 1; }
  install:
    # A real clean install with this release's own scripts, from its URL, on
    # each system; then the stories against the Linux install.
    needs: [version, prerelease]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-26.04, flags: --with-schema}
          - {os: macos-26, flags: ""}
          - {os: windows-2025}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TAG: ${{ needs.version.outputs.tag }}
      FLAGS: ${{ matrix.flags }}
    steps:
      - name: Install with the release's install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh" | bash -s -- ${FLAGS:+"$FLAGS"}
          export PATH="$HOME/.local/bin:$PATH"
          mintd="$(uv tool dir --bin)/mintd"
          test "$("$mintd" --version)" = "mintd ${TAG#v}"
          "$(uv tool dir --bin)/dvc" --version  # dvc landed beside mintd
          "$mintd" init enclave ci-smoke --path "$RUNNER_TEMP"
          if [ -n "$FLAGS" ]; then "$(uv tool dir)/mintd/bin/python" -c 'import pandas, pyarrow'; fi
          echo "MINTD_BIN=$mintd" >> "$GITHUB_ENV"
      - name: Install with the release's install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        # `powershell` is Windows PowerShell 5.1, what `irm | iex` users have.
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/install.ps1"
          irm $url | iex
          # Again, as an update, with the extra.
          & ([scriptblock]::Create((irm $url))) -WithSchema
          $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
          $mintd = Join-Path (uv tool dir --bin).Trim() "mintd.exe"
          $v = & $mintd --version
          if ($v -ne "mintd $($env:TAG.Substring(1))") { throw "installed '$v', expected $env:TAG" }
          & (Join-Path (uv tool dir --bin).Trim() "dvc.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "dvc is not installed beside mintd" }
          & $mintd init enclave ci-smoke --path $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "mintd init failed" }
          & (Join-Path (uv tool dir).Trim() "mintd\Scripts\python.exe") -c "import pandas, pyarrow"
          if ($LASTEXITCODE -ne 0) { throw "the [schema] extra is not installed" }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: runner.os == 'Linux'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: runner.os == 'Linux'
        with:
          version: "0.13.9"
          python-version: "3.13"
          enable-cache: false
      - name: Stories against the installed mintd
        if: runner.os == 'Linux'
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          uv sync --locked --extra dev
          uv run --no-sync pytest tests/stories -q -rxX
  evidence:
    # Writes the gate's results on the prerelease, pass or fail.
    needs: [version, prerelease, install]
    if: always() && needs.prerelease.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: read  # the merged PRs' bodies, for the changelog
    env:
      TAG: ${{ needs.version.outputs.tag }}
      INSTALL: ${{ needs.install.result }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # the merges since the last promoted release
          persist-credentials: false
      - name: Write the evidence on the release notes
        run: |
          set -euo pipefail
          [ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = true ] \
            || { echo "::error::$TAG is not a prerelease; a promoted release is never changed"; exit 1; }
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          install_line="- clean install with this release's install.sh and install.ps1 on Linux (--with-schema), macOS and Windows PowerShell 5.1 (plain, then -WithSchema), and the story tests against the Linux install: $INSTALL"
          # The changelog, from the PRs merged since the last promoted release
          # (RELEASING.md). A failure says so in the notes rather than leaving it
          # out, and a re-run of this job writes it again.
          failed="(The changelog could not be written: see this run's evidence job.)"
          changelog() {
            changes=$(python3 scripts/release_notes.py "$TAG") || {
              echo "::warning::the changelog could not be written; its error is above"
              changes=$failed
            }
          }
          body=$(gh release view "$TAG" --json body --jq .body)
          if [[ $body == "The release gate is running"* ]]; then
            changelog
            notes="$changes

          ---

          commit: $GITHUB_SHA
          gate run: $run_url

          - CI (test.yml) on this tag: passed
          $install_line

          A prerelease: \`releases/latest\` skips it. It becomes the latest release only when the maintainer approves this run's \`release\` environment (RELEASING.md)."
          else
            # A rerun: keep what people have written; replace only the install
            # line, and a changelog that couldn't be written last time.
            notes=$(awk -v line="$install_line" '/^- clean install with /{print line; next} {print}' <<< "$body")
            if [[ $notes == "$failed"* ]]; then
              changelog
              notes="$changes${notes#"$failed"}"
            fi
          fi
          gh release edit "$TAG" --notes "$notes"
  promote:
    needs: [version, install, evidence]
    runs-on: ubuntu-26.04
    # Waits here until the maintainer approves (RELEASING.md).
    environment: release
    permissions:
      contents: write
      actions: read  # to read the environment's protection rules
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Mark the release latest
        run: |
          set -euo pipefail
          # GitHub creates a missing environment unprotected; never promote through one.
          n=$(gh api "repos/$GH_REPO/environments/release" \
                --jq '[(.protection_rules // [])[] | select(.type == "required_reviewers")] | length')
          [ "$n" -ge 1 ] || { echo "::error::the release environment has no required reviewer (RELEASING.md)"; exit 1; }
          [ "$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha)" = "$GITHUB_SHA" ] \
            || { echo "::error::$TAG no longer points at $GITHUB_SHA"; exit 1; }
          # The install line downloads install.sh/install.ps1 from the latest
          # release, so a release without them must never become latest.
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for f in install.sh install.ps1; do
            grep -qx "$f" <<< "$assets" || { echo "::error::$TAG has no $f, so the install line could not install it"; exit 1; }
          done
          # Approving a stale run must not move users back; a rollback is
          # done by hand (RELEASING.md). Only a 404 means "no latest release
          # yet"; any other failure stops here. On an error gh prints the
          # response body on stdout, so the output is never read as a tag then.
          err=$(mktemp)
          if latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>"$err"); then
            :
          elif grep -q 'HTTP 404' "$err"; then
            latest=""
          else
            cat "$err" >&2; exit 1
          fi
          if [ -n "$latest" ] && [ "$(printf '%s\n' "$latest" "$TAG" | sort -V | tail -n1)" != "$TAG" ]; then
            echo "::error::$latest is already latest and newer than $TAG; to roll back, see RELEASING.md"; exit 1
          fi
          # The notes' "A prerelease: …" line is true only until now: it goes in
          # the same edit. A failed read stops here, so the notes are never blanked.
          body=$(gh release view "$TAG" --json body --jq .body)
          notes=$(grep -v '^A prerelease: ' <<< "$body" || true)
          gh release edit "$TAG" --prerelease=false --latest --notes "$notes"
          [ "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = "$TAG" ]
          echo "$TAG is now the latest release"
