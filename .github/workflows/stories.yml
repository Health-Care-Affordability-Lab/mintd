name: stories
# The user stories in tests/stories, run against the installed mintd. Observe
# mode: `stories` is not a required check, so a red run reports without blocking
# a merge. Main's stories and harness judge the PR's wheel, so a PR cannot
# weaken the checks that run on it. When a PR changes the stories, their
# harness, the dependencies or this workflow, its own stories also run here
# against the same wheel, and their summary line goes to the job summary; they
# never decide the job.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# Read-only, whatever the repository's default token permissions become.
permissions:
  contents: read
jobs:
  stories:
    name: stories
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history + tags so setuptools-scm derives a real version, and
          # origin/main for the stories' worktree below.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Keep equal to test.yml, install.sh and install.ps1.
          version: "0.13.9"
          python-version: "3.13"
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Build the PR's mintd
        # As the stories' runner builds it: the wheel and the locked
        # dependencies, in a venv of their own.
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -q -o "$RUNNER_TEMP/locked.txt"
          uv build --wheel -q --build-constraints "$RUNNER_TEMP/locked.txt" -o "$RUNNER_TEMP/dist"
          uv venv -q "$RUNNER_TEMP/mintd"
          uv pip install -q --no-deps --python "$RUNNER_TEMP/mintd" -r "$RUNNER_TEMP/locked.txt" "$RUNNER_TEMP"/dist/*.whl
      - name: Check out main's stories
        run: git worktree add --detach "$RUNNER_TEMP/main" origin/main
      - name: Install main's test environment
        working-directory: ${{ runner.temp }}/main
        run: uv sync --locked --extra dev
      - name: Stories
        working-directory: ${{ runner.temp }}/main
        env:
          MINTD_BIN: ${{ runner.temp }}/mintd/bin/mintd
        run: uv run --no-sync pytest tests/stories -q -rxX -m "not slow"
      - name: The PR's own stories (reported, not judged)
        # One step, so the path check runs inside it: when nothing it watches
        # changed, it says so in the log and the summary and exits. Main's
        # stories above decide the job: this step reports its result, a
        # failure included, and exits 0 on every path.
        if: ${{ !cancelled() }}
        env:
          MINTD_BIN: ${{ runner.temp }}/mintd/bin/mintd
        run: |
          if git diff --quiet origin/main...HEAD -- tests/stories tests/_harness tests/conftest.py pyproject.toml uv.lock .github/workflows/stories.yml; then
            echo "The PR's own stories: not run; the PR changes no story, harness, dependency or this workflow." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          uv sync --locked --extra dev || { echo "**The PR's own stories could not run**: \`uv sync\` failed." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          uv run --no-sync pytest tests/stories -q -rxX -m "not slow" 2>&1 | tee "$RUNNER_TEMP/own-stories.txt"
          rc=${PIPESTATUS[0]}
          line=$(tail -n 1 "$RUNNER_TEMP/own-stories.txt" | sed -E 's/^=+ //; s/ =+$//')
          if [ "$rc" -eq 0 ]; then
            echo "The PR's own stories: $line" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "**The PR's own stories FAILED** (pytest exit $rc): $line. Main's stories decide this job; this is a report." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
