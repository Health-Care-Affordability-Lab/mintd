[project]
name = "mintd"
dynamic = ["version"]
description = "Lightweight data product framework for research labs"
requires-python = ">=3.11"
dependencies = [
    "pydantic ~= 2.12",
    "pyyaml ~= 6.0",
    "boto3 ~= 1.34",
    "rich ~= 13.0",
    "jinja2 ~= 3.1",
    "dvc >= 3.66, < 4.0",
    "dvc-s3 >= 3.3, < 4",
    # dvc's own .dvcignore engine; mintd reads .dvcignore to compare a folder pointer's list with the folder.
    "pathspec >= 0.10.3, < 2",
]

[project.optional-dependencies]
dev = [
    "pytest >= 7.0",
    "pytest-xdist >= 3.0",
    "mypy >= 1.0",
    # Pinned: the scaffold's templates are formatted with exactly this
    # version, and test_c7_rendered_python_is_ruff_clean checks the rendered
    # Python with it, so a bump means re-running
    # `uv run ruff format --isolated src/mintd/files/*.py.j2` in the same commit.
    "ruff == 0.15.13",
    "types-PyYAML",
    "moto[s3] ~= 5.0",
    # moto's ThreadedMotoServer, for tests that run a real dvc subprocess
    # against S3; moto[server] would also pull in every other service's deps.
    "flask",
    "flask-cors",
    "types-boto3",
    "mintd[schema]",
]
schema = [
    "pandas >= 2.2, < 4",
    "pyarrow >= 16",
]

[build-system]
requires = ["setuptools >= 61", "setuptools-scm >= 8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mintd = ["files/*.j2", "files/.Rprofile.j2", "files/*.txt"]

[tool.setuptools_scm]
# Versions are the vX.Y.Z tags .github/workflows/tag.yml puts on each PR merged
# into main; a build between tags reads e.g. 0.1.4.dev2+g<shortsha>. The
# fallback covers a build with no git history, where setuptools-scm would error.
version_scheme = "guess-next-dev"
fallback_version = "0.0.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# The stories and the live tier run the installed binary in runs of their own:
# `pytest tests/stories` and `pytest tests/live` (an explicit path is still
# collected).
addopts = ["--ignore=tests/stories", "--ignore=tests/live"]
markers = [
    "integration: requires MINTD_RUN_INTEGRATION=1 and real git",
]
# One clean run leaves ~179 MB under the pytest tmp root, dominated by
# `test_import_rescue`'s 10 MiB multipart fixture across 8 tests (each landing
# in the workspace and again in `.dvc/cache`). Retaining the default 3 sessions
# of that is ~0.5 GB of temp files nobody reads.
#
# `failed` keeps the directories for failing tests, which is the case you
# actually need on disk; passing tests' dirs go at session end. To inspect a
# PASSING test's tmp_path, override on the command line -- note that
# `--basetemp` alone does NOT defeat this, the policy still applies:
#     pytest -o tmp_path_retention_policy=all --basetemp=/tmp/x tests/foo.py
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

[tool.ruff]
line-length = 120

[project.scripts]
mintd = "mintd.cli:main"

[tool.ruff.lint]
select = [
    "E", "F", "T201", "B",
    "TID251", "TID253",                    # banned APIs; pandas/pyarrow only inside functions
    "BLE001", "S110", "S112",              # no swallowed exceptions
    "PGH004", "RUF100",                    # a noqa names its code and is still needed
    "C901", "PLR0912", "PLR0915",          # complexity caps, set below
    "DTZ005", "DTZ011",                    # no naive local times
    "S602", "S604", "S605",                # no shell=True or os.system
    "T100", "ERA001", "ANN001",            # no breakpoints, commented-out code or unannotated arguments
]
ignore = ["E501"]  # line length is not enforced: `ruff format` is not run in CI

# Today's largest function sets each cap (publish.py, cli.py). Lower them as
# functions split; tests/test_substrate_rules.py stops them going up.
[tool.ruff.lint.mccabe]
max-complexity = 39

[tool.ruff.lint.pylint]
max-branches = 41
max-statements = 183

[tool.ruff.lint.flake8-tidy-imports]
banned-module-level-imports = ["pandas", "pyarrow"]

# TID251 makes each risky ability a lint gate instead of a docstring claim:
# spawning a process, reaching S3, deleting, moving or copying files, and
# opening a network connection. A module that does one of these is listed in
# per-file-ignores below, so the list is the review surface and the repair
# backlog. CI also runs TID251 with --ignore-noqa, so only that list exempts.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess" = { msg = "spawn through mintd._subprocess.run_streaming; see per-file-ignores for the sanctioned seams" }
"boto3" = { msg = "reach S3 through mintd._s3; it is the only module that imports boto3 or botocore" }
"botocore" = { msg = "reach S3 through mintd._s3; it is the only module that imports boto3 or botocore" }
"shutil.rmtree" = { msg = "deleting files is limited to the modules in per-file-ignores; add one there only with a reason" }
"os.remove" = { msg = "deleting files is limited to the modules in per-file-ignores; add one there only with a reason" }
"os.unlink" = { msg = "deleting files is limited to the modules in per-file-ignores; add one there only with a reason" }
"os.rmdir" = { msg = "deleting files is limited to the modules in per-file-ignores; add one there only with a reason" }
"os.removedirs" = { msg = "deleting files is limited to the modules in per-file-ignores; add one there only with a reason" }
"os.truncate" = { msg = "deleting files is limited to the modules in per-file-ignores; add one there only with a reason" }
"shutil.move" = { msg = "move files through mintd._atomic; see per-file-ignores for the modules that may" }
"os.rename" = { msg = "move files through mintd._atomic; see per-file-ignores for the modules that may" }
"os.replace" = { msg = "move files through mintd._atomic; see per-file-ignores for the modules that may" }
"os.renames" = { msg = "move files through mintd._atomic; see per-file-ignores for the modules that may" }
"shutil.copyfile" = { msg = "copying files is limited to the modules in per-file-ignores; add one there only with a reason" }
"shutil.copytree" = { msg = "copying files is limited to the modules in per-file-ignores; add one there only with a reason" }
"urllib.request" = { msg = "mintd reaches the network only through git, dvc and boto3; a new client needs a reviewed seam" }
"requests" = { msg = "mintd reaches the network only through git, dvc and boto3; a new client needs a reviewed seam" }
"httpx" = { msg = "mintd reaches the network only through git, dvc and boto3; a new client needs a reviewed seam" }
"socket" = { msg = "mintd reaches the network only through git, dvc and boto3; a new client needs a reviewed seam" }
"urllib3" = { msg = "mintd reaches the network only through git, dvc and boto3; a new client needs a reviewed seam" }
"http.client" = { msg = "mintd reaches the network only through git, dvc and boto3; a new client needs a reviewed seam" }

# Every entry is an exemption that tests/test_substrate_rules.py pins, so the
# map can only shrink. The codes after the first block are today's offenders.
[tool.ruff.lint.per-file-ignores]
"src/mintd/files/**" = ["T201", "E501", "F401", "F811"]
# tests drive the real CLI; these rules guard src/
"tests/**" = ["T201", "E501", "TID251", "TID253", "ANN001", "DTZ005", "ERA001"]
# sanctioned seams
"src/mintd/_subprocess.py" = ["TID251", "ANN001"]  # process
"src/mintd/_registry_git_ops.py" = ["TID251"]      # process
"src/mintd/_atomic.py" = ["TID251"]                # move
"src/mintd/_s3.py" = ["TID251", "BLE001"]          # S3; BLE001: probe_versions turns one HEAD's unexpected error into an inconclusive verdict
# pending repair. TID251: spawn (_init_ops 11 sites, _fast_sync_ops 1 dvc --version
# probe, _producer_git_ops 1 + 4 type references), deletes and moves outside a
# seam. The "sole seam" docstrings in _dvc_ops.py and _registry_git_ops.py
# stay false until these are routed through a seam and the entry is deleted.
"src/mintd/_init_ops.py" = ["TID251"]
"src/mintd/_fast_sync_ops.py" = ["TID251", "BLE001", "S110"]
"src/mintd/_producer_git_ops.py" = ["TID251"]
"src/mintd/_aws_credentials.py" = ["TID251"]
"src/mintd/cli.py" = ["T201", "BLE001", "S110", "ANN001"]
"src/mintd/config_ops.py" = ["T201", "BLE001", "ANN001"]
"src/mintd/data.py" = ["TID251", "BLE001"]
"src/mintd/enclave.py" = ["DTZ011"]
"src/mintd/init.py" = ["TID251"]
"src/mintd/pending_registrations.py" = ["TID251"]
"src/mintd/producer.py" = ["TID251"]
"src/mintd/_cache_ops.py" = ["BLE001"]
"src/mintd/_import_rescue_ops.py" = ["BLE001"]
"src/mintd/_push_verify.py" = ["BLE001", "S112"]
"src/mintd/_templates/_render.py" = ["BLE001"]
"src/mintd/check.py" = ["BLE001"]
"src/mintd/data_ops.py" = ["BLE001"]
"src/mintd/schema_ops.py" = ["BLE001"]
"src/mintd/model.py" = ["ERA001"]
"src/mintd/publish.py" = ["ANN001"]
