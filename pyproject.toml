[project]
name = "mintd"
dynamic = ["version"]
description = "Lightweight data product framework for research labs"
requires-python = ">=3.11"
dependencies = [
    "pydantic ~= 2.12",
    "pyyaml ~= 6.0",
    "boto3 ~= 1.34",
    "rich ~= 13.0",
    "jinja2 ~= 3.1",
    "dvc >= 3.66, < 4.0",
    "dvc-s3 >= 3.3, < 4",
]

[project.optional-dependencies]
dev = [
    "pytest >= 7.0",
    "mypy >= 1.0",
    # Pinned in lockstep with the scaffold's own ruff hook
    # (src/mintd/files/pre-commit-config.yaml.j2 `rev:`). The scaffold's
    # templates are formatted with exactly this version, so a one-sided
    # bump makes a fresh scaffold fail its own first commit again.
    # test_c8_scaffold_ruff_pin_matches_installed is what catches that.
    "ruff == 0.15.13",
    "types-PyYAML",
    "moto[s3] ~= 5.0",
    "types-boto3",
    "mintd[schema]",
]
schema = [
    "pandas >= 2.2, < 4",
    "pyarrow >= 16",
]

[build-system]
requires = ["setuptools >= 61", "setuptools-scm >= 8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mintd = ["files/*.j2", "files/.Rprofile.j2", "files/*.txt"]

[tool.setuptools_scm]
# No git tags exist yet; without a fallback setuptools-scm errors out.
# Produces e.g. 0.0.1.dev74+g<shortsha> until the first real tag lands.
version_scheme = "guess-next-dev"
fallback_version = "0.0.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: requires MINTD_RUN_INTEGRATION=1 and real git",
]
# One clean run leaves ~179 MB under the pytest tmp root, dominated by
# `test_import_rescue`'s 10 MiB multipart fixture across 8 tests (each landing
# in the workspace and again in `.dvc/cache`). Retaining the default 3 sessions
# of that is ~0.5 GB of temp files nobody reads.
#
# `failed` keeps the directories for failing tests, which is the case you
# actually need on disk; passing tests' dirs go at session end. To inspect a
# PASSING test's tmp_path, override on the command line -- note that
# `--basetemp` alone does NOT defeat this, the policy still applies:
#     pytest -o tmp_path_retention_policy=all --basetemp=/tmp/x tests/foo.py
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

[tool.ruff]
line-length = 120

[project.scripts]
mintd = "mintd.cli:main"

[tool.ruff.lint]
select = ["E", "F", "T201", "B", "TID251"]
ignore = ["E501"]  # line length is not enforced: `ruff format` is not run in CI

# TID251 makes the process-spawning boundary a lint gate instead of a docstring
# claim. `_dvc_ops.py:3` and `_registry_git_ops.py:1` both assert they are the
# only module that shells out; the per-file-ignores below are the modules that
# actually do, so the list is the repair backlog and the rule stops a sixth.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess" = { msg = "spawn through mintd._subprocess.run_streaming; see per-file-ignores for the sanctioned seams" }

[tool.ruff.lint.per-file-ignores]
"src/mintd/cli.py" = ["T201"]
"src/mintd/config_ops.py" = ["T201"]
"src/mintd/files/**" = ["T201", "E501", "F401", "F811"]
"tests/**" = ["T201", "E501", "TID251"]  # tests drive the real CLI; the boundary is a src/ concern
# sanctioned process seams
"src/mintd/_subprocess.py" = ["TID251"]
"src/mintd/_registry_git_ops.py" = ["TID251"]
# pending repair: these spawn directly, which is why the "sole seam" docstrings
# are false. Route through _subprocess.run_streaming and delete the entry.
"src/mintd/_init_ops.py" = ["TID251"]          # 11 spawn sites
"src/mintd/_fast_sync_ops.py" = ["TID251"]     # 1 (dvc --version probe)
"src/mintd/_producer_git_ops.py" = ["TID251"]  # 1 spawn + 4 type references
